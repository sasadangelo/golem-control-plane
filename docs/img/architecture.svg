<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif">

  <!-- Background -->
  <rect width="900" height="640" fill="#ffffff"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- USER LAYER -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="30" y="20" width="840" height="80" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="450" y="42" text-anchor="middle" font-size="10" font-weight="700" fill="#57606a" letter-spacing="1">USER LAYER</text>

  <!-- CLI -->
  <rect x="60" y="52" width="160" height="36" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="140" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">CLI</text>
  <text x="140" y="81" text-anchor="middle" font-size="10" fill="#1e40af">Python · Typer</text>

  <!-- Web Chat UI -->
  <rect x="680" y="52" width="160" height="36" rx="5" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="760" y="68" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Web Chat UI</text>
  <text x="760" y="81" text-anchor="middle" font-size="10" fill="#1e40af">Browser · WebSocket</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ARROW: User → Control Plane -->
  <!-- ═══════════════════════════════════════════════════ -->
  <line x1="140" y1="88" x2="140" y2="138" stroke="#3b82d4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="136,133 140,142 144,133" fill="#3b82d4"/>
  <line x1="760" y1="88" x2="760" y2="138" stroke="#3b82d4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="756,133 760,142 764,133" fill="#3b82d4"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- CONTROL PLANE -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="30" y="142" width="840" height="160" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="450" y="162" text-anchor="middle" font-size="10" font-weight="700" fill="#57606a" letter-spacing="1">CONTROL PLANE  ·  FastAPI · Python</text>

  <!-- REST / WS API -->
  <rect x="55" y="172" width="170" height="58" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="140" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">REST / WebSocket API</text>
  <text x="140" y="204" text-anchor="middle" font-size="9.5" fill="#166534">POST /agents</text>
  <text x="140" y="217" text-anchor="middle" font-size="9.5" fill="#166534">WS /chat/{agent_id}</text>

  <!-- Chat Proxy -->
  <rect x="250" y="172" width="140" height="58" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="320" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">Chat Proxy</text>
  <text x="320" y="204" text-anchor="middle" font-size="9.5" fill="#166534">Single ClusterIP</text>
  <text x="320" y="217" text-anchor="middle" font-size="9.5" fill="#166534">gateway (no per-pod Ingress)</text>

  <!-- A2A Card Registry -->
  <rect x="415" y="172" width="150" height="58" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="490" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">A2A Card Registry</text>
  <text x="490" y="204" text-anchor="middle" font-size="9.5" fill="#166534">Collects Agent Cards</text>
  <text x="490" y="217" text-anchor="middle" font-size="9.5" fill="#166534">Broker peer discovery</text>

  <!-- K8s Provisioner -->
  <rect x="590" y="172" width="155" height="58" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="667" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">K8s Provisioner</text>
  <text x="667" y="204" text-anchor="middle" font-size="9.5" fill="#166534">Namespace + Pod + Quota</text>
  <text x="667" y="217" text-anchor="middle" font-size="9.5" fill="#166534">NetworkPolicy + TTL GC</text>

  <!-- Persistence -->
  <rect x="770" y="172" width="80" height="58" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="810" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">Persistence</text>
  <text x="810" y="204" text-anchor="middle" font-size="9.5" fill="#166534">PostgreSQL</text>
  <text x="810" y="217" text-anchor="middle" font-size="9.5" fill="#166534">Redis</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ARROW: Control Plane → Sandbox -->
  <!-- ═══════════════════════════════════════════════════ -->
  <line x1="450" y1="302" x2="450" y2="348" stroke="#16a34a" stroke-width="1.5"/>
  <polygon points="446,343 450,352 454,343" fill="#16a34a"/>
  <text x="460" y="330" font-size="9" fill="#16a34a">provision</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- SANDBOX ZONE -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="30" y="352" width="840" height="220" rx="6" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="450" y="372" text-anchor="middle" font-size="10" font-weight="700" fill="#57606a" letter-spacing="1">AGENT SANDBOX  ·  K8s Namespace per Agent  ·  NetworkPolicy default-deny egress</text>

  <!-- Agent Runner Pod (left) -->
  <rect x="55" y="382" width="215" height="170" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="162" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">Agent Runner Pod</text>
  <text x="162" y="414" text-anchor="middle" font-size="9" fill="#6d28d9">Single generic Docker image</text>

  <rect x="68" y="420" width="189" height="18" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="162" y="433" text-anchor="middle" font-size="9" fill="#4c1d95">LangGraph agentic loop</text>

  <rect x="68" y="442" width="189" height="18" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="162" y="455" text-anchor="middle" font-size="9" fill="#4c1d95">SYSTEM_PROMPT · ENABLED_TOOLS · AGENT_ID</text>

  <rect x="68" y="464" width="189" height="18" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="162" y="477" text-anchor="middle" font-size="9" fill="#4c1d95">/.well-known/agent.json  (A2A Card)</text>

  <rect x="68" y="486" width="189" height="18" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="162" y="499" text-anchor="middle" font-size="9" fill="#4c1d95">Cron / Timer / Webhook tasks</text>

  <rect x="68" y="508" width="189" height="18" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="162" y="521" text-anchor="middle" font-size="9" fill="#4c1d95">Signed Agent Card  (A2A v1.0)</text>

  <rect x="68" y="530" width="189" height="12" rx="3" fill="#7c5cd8"/>
  <text x="162" y="540" text-anchor="middle" font-size="8" fill="#ffffff" font-weight="700">Agent Runner A (e.g. Log-Analyzer)</text>

  <!-- MCP box -->
  <rect x="300" y="382" width="175" height="100" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="387" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#7c2d12">MCP Servers</text>
  <text x="387" y="414" text-anchor="middle" font-size="9" fill="#9a3412">Agent → Tool (vertical)</text>
  <rect x="312" y="420" width="151" height="14" rx="3" fill="#ffedd5" stroke="#fed7aa" stroke-width="1"/>
  <text x="387" y="431" text-anchor="middle" font-size="9" fill="#7c2d12">Log reader · DB query</text>
  <rect x="312" y="438" width="151" height="14" rx="3" fill="#ffedd5" stroke="#fed7aa" stroke-width="1"/>
  <text x="387" y="449" text-anchor="middle" font-size="9" fill="#7c2d12">File system · External APIs</text>
  <rect x="312" y="456" width="151" height="14" rx="3" fill="#ffedd5" stroke="#fed7aa" stroke-width="1"/>
  <text x="387" y="467" text-anchor="middle" font-size="9" fill="#7c2d12">Whitelisted in NetworkPolicy</text>

  <!-- A2A box -->
  <rect x="300" y="496" width="175" height="76" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="387" y="514" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">A2A Channel</text>
  <text x="387" y="528" text-anchor="middle" font-size="9" fill="#166534">Agent ↔ Agent (horizontal)</text>
  <rect x="312" y="534" width="151" height="14" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="387" y="545" text-anchor="middle" font-size="9" fill="#14532d">Task lifecycle: submitted→done</text>
  <rect x="312" y="552" width="151" height="14" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="387" y="563" text-anchor="middle" font-size="9" fill="#14532d">Artifact exchange</text>

  <!-- Security box -->
  <rect x="510" y="382" width="175" height="100" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="597" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">Security Layer</text>
  <text x="597" y="414" text-anchor="middle" font-size="9" fill="#991b1b">Isolation per sandbox</text>
  <rect x="522" y="420" width="151" height="14" rx="3" fill="#fee2e2" stroke="#fecaca" stroke-width="1"/>
  <text x="597" y="431" text-anchor="middle" font-size="9" fill="#7f1d1d">NetworkPolicy default-deny</text>
  <rect x="522" y="438" width="151" height="14" rx="3" fill="#fee2e2" stroke="#fecaca" stroke-width="1"/>
  <text x="597" y="449" text-anchor="middle" font-size="9" fill="#7f1d1d">ResourceQuota CPU/RAM</text>
  <rect x="522" y="456" width="151" height="14" rx="3" fill="#fee2e2" stroke="#fecaca" stroke-width="1"/>
  <text x="597" y="467" text-anchor="middle" font-size="9" fill="#7f1d1d">K8s Secrets → Vault (Phase 2)</text>

  <!-- Agent Runner Pod (right) -->
  <rect x="710" y="382" width="150" height="170" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="785" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#4c1d95">Agent Runner Pod</text>
  <text x="785" y="414" text-anchor="middle" font-size="9" fill="#6d28d9">Single generic Docker image</text>
  <rect x="722" y="420" width="126" height="18" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="785" y="433" text-anchor="middle" font-size="9" fill="#4c1d95">LangGraph agentic loop</text>
  <rect x="722" y="442" width="126" height="18" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="785" y="455" text-anchor="middle" font-size="9" fill="#4c1d95">SYSTEM_PROMPT …</text>
  <rect x="722" y="464" width="126" height="18" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="785" y="477" text-anchor="middle" font-size="9" fill="#4c1d95">/.well-known/agent.json</text>
  <rect x="722" y="486" width="126" height="18" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="785" y="499" text-anchor="middle" font-size="9" fill="#4c1d95">Cron / Timer / Webhook</text>
  <rect x="722" y="508" width="126" height="18" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="785" y="521" text-anchor="middle" font-size="9" fill="#4c1d95">Signed Agent Card</text>
  <rect x="722" y="530" width="126" height="12" rx="3" fill="#7c5cd8"/>
  <text x="785" y="540" text-anchor="middle" font-size="8" fill="#ffffff" font-weight="700">Agent Runner B (e.g. Report-Writer)</text>

  <!-- A2A arrow between the two agent pods -->
  <line x1="270" y1="480" x2="300" y2="480" stroke="#7c5cd8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="295,476 304,480 295,484" fill="#7c5cd8"/>
  <line x1="475" y1="540" x2="710" y2="480" stroke="#7c5cd8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="706,477 714,482 705,485" fill="#7c5cd8"/>
  <text x="560" y="528" text-anchor="middle" font-size="9" fill="#7c5cd8" font-weight="700">A2A</text>

  <!-- MCP arrow from left agent to MCP box -->
  <line x1="270" y1="430" x2="300" y2="430" stroke="#d97706" stroke-width="1.5"/>
  <polygon points="295,426 304,430 295,434" fill="#d97706"/>
  <text x="285" y="425" text-anchor="middle" font-size="9" fill="#d97706">MCP</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- Legend -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="30" y="588" width="840" height="38" rx="5" fill="#f7f8fa" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="50" y1="607" x2="74" y2="607" stroke="#3b82d4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="80" y="611" font-size="10" fill="#57606a">REST / WS call</text>
  <line x1="175" y1="607" x2="199" y2="607" stroke="#7c5cd8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="205" y="611" font-size="10" fill="#57606a">A2A peer delegation</text>
  <line x1="330" y1="607" x2="354" y2="607" stroke="#d97706" stroke-width="1.5"/>
  <text x="360" y="611" font-size="10" fill="#57606a">MCP tool call</text>
  <line x1="450" y1="607" x2="474" y2="607" stroke="#16a34a" stroke-width="1.5"/>
  <text x="480" y="611" font-size="10" fill="#57606a">K8s provisioning</text>
  <rect x="580" y="600" width="10" height="10" rx="2" fill="#7c5cd8"/>
  <text x="596" y="611" font-size="10" fill="#57606a">Agent Runner Pod</text>
  <rect x="700" y="600" width="10" height="10" rx="2" fill="#16a34a"/>
  <text x="716" y="611" font-size="10" fill="#57606a">Control Plane service</text>

</svg>
