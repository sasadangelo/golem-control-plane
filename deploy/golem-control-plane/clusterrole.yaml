apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: golem-control-plane
  labels:
    app.kubernetes.io/part-of: golem
rules:
  # Manage agent sandbox namespaces
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "delete"]

  # Manage agent runner pods
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/status"]
    verbs: ["get", "list", "create", "delete"]

  # Apply resource quotas per sandbox namespace
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list", "create", "delete"]

  # Mount runner config.yaml as a ConfigMap in each sandbox namespace
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "delete"]

  # Create services for agent pods
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]

  # Apply network policies per sandbox namespace
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "delete"]
