name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  # Separate path-filter job so both downstream jobs can reference its outputs.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      lintable: ${{ steps.filter.outputs.lintable }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Triggers unit tests: Python source, tests, and project config.
            code:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'

            # Triggers pre-commit: everything above plus scripts, Docker,
            # deploy manifests, and the pre-commit config itself.
            # Excludes: docs/, .github/, .vscode/, *.md at root.
            lintable:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.pre-commit-config.yaml'
              - 'Dockerfile'
              - '*.sh'
              - 'deploy/**'
              - 'minikube/**'

  pre-commit:
    name: Pre-commit hooks
    needs: changes
    if: needs.changes.outputs.lintable == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pre-commit/action@v3.0.1

  unit-tests:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install uv && uv sync
      - name: Run tests
        run: uv run pytest --tb=short --cov=. --cov-report=term-missing
