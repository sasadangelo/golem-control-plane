[project]
name = "golem-runner"
version = "0.1.0"
description = "Generic Agent Runner — configurable via environment variables"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "langgraph>=0.0.30",
  "langchain-ibm>=0.3.0",
  "langchain-core>=0.1.30",
  "pydantic>=2.6.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
