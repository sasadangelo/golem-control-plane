[project]
name = "golem-control-plane"
version = "0.1.0"
description = "Golem Control Plane — agent sandbox provisioning and A2A Card Registry"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "kubernetes>=29.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
  "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
