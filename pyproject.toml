[project]
name = "golem-control-plane"
version = "0.1.0"
description = "Golem Control Plane — agent sandbox provisioning and A2A Card Registry"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "websockets>=12.0",
  "kubernetes>=29.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
  "pydantic-settings[yaml]>=2.2.0",
  "python-multipart>=0.0.12",
  "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "types-PyYAML>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
known-first-party = ["core", "domain", "infrastructure", "interfaces"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
